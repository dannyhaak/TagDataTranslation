name: Release npm

on:
  push:
    tags: ["v*"]
  # publish an existing tag again, e.g. after a failed publish
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to publish (e.g. v4.0.0)"
        required: true

# npm trusted publishing: authenticates with a GitHub OIDC token, no NPM_TOKEN secret
permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Setup Node.js
        uses: actions/setup-node@v4
        # no registry-url: it makes setup-node write a placeholder NODE_AUTH_TOKEN to .npmrc,
        # which npm would send instead of doing the trusted publishing (OIDC) exchange
        with:
          node-version: 24

      # trusted publishing needs npm 11.5.1 or later
      - name: Update npm
        run: npm install -g npm@latest && npm --version

      - name: Set version from tag
        run: |
          VERSION="${RELEASE_TAG#v}"
          cd npm && npm version "$VERSION" --no-git-tag-version --allow-same-version

      - name: Install WASM workload
        run: dotnet workload install wasm-tools

      - name: Build WASM
        run: node npm/scripts/build.js

      - name: Run smoke test
        run: node npm/test/smoke.js

      - name: Publish to npm
        run: cd npm && npm publish --access public --loglevel verbose
